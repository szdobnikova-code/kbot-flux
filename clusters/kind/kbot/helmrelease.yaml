apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kbot
  namespace: flux-system
spec:
  interval: 1m
  chart:
    spec:
      chart: ./helm/kbot
      sourceRef:
        kind: GitRepository
        name: kbot
        namespace: flux-system
      interval: 1m
      reconcileStrategy: Revision
